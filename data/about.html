<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="sidebar-logo">IQ</div>
        <nav class="sidebar-nav">
            <a href="/dashboard.html" class="sidebar-nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                <span>Dashboard</span>
            </a>
            <a href="/setup.html" class="sidebar-nav-item" id="config-link">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
                <span>Setup</span>
            </a>
            <a href="/users.html" class="sidebar-nav-item" id="users-link">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span>Users</span>
            </a>
            <a href="/log.html" class="sidebar-nav-item" id="log-link">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                <span>Log</span>
            </a>
            <a href="/about.html" class="sidebar-nav-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                <span>About</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <span class="product" id="sidebar-product"></span>
            <span class="version" id="sidebar-version"></span>
        </div>
    </aside>

    <div class="app-main">
        <header class="app-header">
            <div class="app-header-title">
                <h1>About</h1>
                <p>Device, hardware, and system information</p>
            </div>
            <div class="app-header-actions">
                <span class="hostname-chip" id="topbar-hostname"></span>
                <span class="user-chip" id="whoami"></span>
                <button class="icon-button" id="logout-button" title="Sign out">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </header>

        <main class="setup-main">
            <div class="tabs-bar">
                <div class="tabs" id="tabs"></div>
            </div>
            <div id="panels"></div>
        </main>
    </div>
</div>

<script src="/notifications.js"></script>
<script>
(function () {
    function formatBytes(bytes) {
        if (bytes >= 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(2) + " MiB";
        if (bytes >= 1024) return (bytes / 1024).toFixed(2) + " KiB";
        return bytes + " B";
    }

    function pad(value) { return String(value).padStart(2, "0"); }

    function formatUptime(totalSeconds) {
        const days = Math.floor(totalSeconds / 86400);
        const hours = Math.floor((totalSeconds % 86400) / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = Math.floor(totalSeconds % 60);
        return days + "d " + pad(hours) + ":" + pad(minutes) + ":" + pad(seconds);
    }

    function row(label, value, mono) {
        const item = document.createElement("div");
        item.className = "setting-row";

        const text = document.createElement("div");
        text.className = "setting-row-text";
        const labelEl = document.createElement("div");
        labelEl.className = "setting-label";
        labelEl.textContent = label;
        text.appendChild(labelEl);
        item.appendChild(text);

        const control = document.createElement("div");
        control.className = "setting-row-control";
        const valueEl = document.createElement("span");
        valueEl.className = "setting-value" + (mono ? " mono" : "");
        valueEl.textContent = value;
        control.appendChild(valueEl);
        item.appendChild(control);

        return item;
    }

    function card(title, desc, rows) {
        const element = document.createElement("div");
        element.className = "setup-card";

        const header = document.createElement("div");
        header.className = "panel-header";
        const heading = document.createElement("h2");
        heading.textContent = title;
        const description = document.createElement("p");
        description.textContent = desc;
        header.appendChild(heading);
        header.appendChild(description);
        element.appendChild(header);

        const list = document.createElement("div");
        list.className = "settings-list";
        rows.forEach(function (item) { list.appendChild(item); });
        element.appendChild(list);

        return element;
    }

    // ESP8266-shaped tabs: no PSRAM, no second core, no Bluetooth, no
    // ESP-IDF/FreeRTOS - those are ESP32 concepts the original DeviceIQ
    // About page reports on, which this chip simply does not have.
    const TAB_DEFS = [
        {
            id: "Version", title: "Version", desc: "Product and firmware identification.",
            rows: function (data) {
                return [
                    row("Product", data.version.family + " " + data.version.product),
                    row("Serial Number", data.version.serial, true),
                    row("Hardware", data.version.hardwareModel + " (v" + data.version.hardware + ")"),
                    row("Software Version", data.version.software)
                ];
            }
        },
        {
            id: "Hardware", title: "Hardware", desc: "Chip and radio information.",
            rows: function (data) {
                return [
                    row("Chip ID", data.hardware.chipId, true),
                    row("CPU Frequency", data.hardware.cpuFrequencyMHz + " MHz"),
                    row("Core Version", data.hardware.coreVersion),
                    row("SDK Version", data.hardware.sdkVersion),
                    row("WiFi MAC", data.hardware.wifiMac, true)
                ];
            }
        },
        {
            id: "Flash", title: "Flash & Firmware", desc: "Onboard flash storage and sketch details.",
            rows: function (data) {
                return [
                    row("Flash Chip ID", data.flash.chipId, true),
                    row("Flash Size", formatBytes(data.flash.sizeBytes)),
                    row("Flash Real Size", formatBytes(data.flash.realSizeBytes)),
                    row("Flash Speed", data.flash.speedMHz + " MHz"),
                    row("Flash Mode", data.flash.mode),
                    row("Sketch Size", formatBytes(data.firmware.sketchSizeBytes)),
                    row("Free Sketch Space", formatBytes(data.firmware.freeSketchSpaceBytes)),
                    row("Sketch MD5", data.firmware.sketchMD5, true)
                ];
            }
        },
        {
            id: "Runtime", title: "Runtime", desc: "Operating system and process information.",
            rows: function (data) {
                return [
                    row("Reset Reason", data.runtime.resetReason),
                    row("Reset Info", data.runtime.resetInfo),
                    row("Uptime", formatUptime(data.runtime.uptimeSeconds))
                ];
            }
        },
        {
            id: "Memory", title: "Memory", desc: "Heap usage.",
            adminOnly: true,
            rows: function (data) {
                return [
                    row("Free Heap", formatBytes(data.memory.freeHeapBytes)),
                    row("Heap Fragmentation", data.memory.heapFragmentationPercent + "%"),
                    row("Largest Free Block", formatBytes(data.memory.maxFreeBlockSizeBytes))
                ];
            }
        },
        {
            id: "Filesystem", title: "Filesystem", desc: "LittleFS storage statistics.",
            adminOnly: true,
            rows: function (data) {
                const fs = data.filesystem;
                if (!fs.mounted) return [row("Mounted", "No")];
                return [
                    row("Mounted", "Yes"),
                    row("Total", formatBytes(fs.totalBytes)),
                    row("Used", formatBytes(fs.usedBytes)),
                    row("Available", formatBytes(fs.availableBytes)),
                    row("Usage", fs.usagePercent + "%")
                ];
            }
        }
    ];

    let activeTab = TAB_DEFS[0].id;

    function selectTab(tabId) {
        activeTab = tabId;
        document.querySelectorAll(".tab-button").forEach(function (button) {
            button.classList.toggle("active", button.dataset.tab === tabId);
        });
        document.querySelectorAll(".tab-panel").forEach(function (panel) {
            panel.classList.toggle("active", panel.id === "panel-" + tabId);
        });
    }

    function render(data) {
        const defs = TAB_DEFS.filter(function (def) { return !def.adminOnly || data.admin; });

        const tabsContainer = document.getElementById("tabs");
        const panelsContainer = document.getElementById("panels");
        tabsContainer.innerHTML = "";
        panelsContainer.innerHTML = "";

        defs.forEach(function (def) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "tab-button";
            button.dataset.tab = def.id;
            button.textContent = def.title;
            button.addEventListener("click", function () { selectTab(def.id); });
            tabsContainer.appendChild(button);

            const panel = document.createElement("div");
            panel.className = "tab-panel";
            panel.id = "panel-" + def.id;
            panel.appendChild(card(def.title, def.desc, def.rows(data)));
            panelsContainer.appendChild(panel);
        });

        if (!defs.some(function (def) { return def.id === activeTab; })) activeTab = defs[0].id;
        selectTab(activeTab);
    }

    document.getElementById("logout-button").addEventListener("click", function () {
        fetch("/api/logout", { method: "POST" }).finally(function () { window.location.replace("/"); });
    });

    fetch("/api/session").then(function (response) { return response.json(); }).then(function (session) {
        if (!session.authenticated) {
            window.location.replace("/");
            return Promise.reject();
        }

        document.getElementById("topbar-hostname").textContent = session.hostname;
        document.getElementById("whoami").textContent = session.username + (session.admin ? " · admin" : "");
        document.title = session.productFamily + " [" + session.hostname + "] - About";
        document.getElementById("sidebar-product").textContent = session.productFamily + " " + session.productName;
        document.getElementById("sidebar-version").textContent = "v" + session.softwareVersion;
        if (!session.admin) {
            document.getElementById("config-link").remove();
            document.getElementById("users-link").remove();
            document.getElementById("log-link").remove();
        } else if (!session.logFileEnabled) {
            document.getElementById("log-link").remove();
        }

        return fetch("/api/about");
    }).then(function (response) { return response.json(); })
        .then(render)
        .catch(function () {});
})();
</script>
</body>
</html>

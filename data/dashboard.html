<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="sidebar-logo">IQ</div>
        <nav class="sidebar-nav">
            <a href="/dashboard.html" class="sidebar-nav-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                <span>Dashboard</span>
            </a>
            <a href="/setup.html" class="sidebar-nav-item" id="config-link">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
                <span>Setup</span>
            </a>
            <a href="/users.html" class="sidebar-nav-item" id="users-link">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span>Users</span>
            </a>
            <a href="/about.html" class="sidebar-nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                <span>About</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <span class="product" id="sidebar-product"></span>
            <span class="version" id="sidebar-version"></span>
        </div>
    </aside>

    <div class="app-main">
        <header class="app-header">
            <div class="app-header-title">
                <h1>Dashboard</h1>
                <p>Live blind status and controls</p>
            </div>
            <div class="app-header-actions">
                <span class="hostname-chip" id="topbar-hostname"></span>
                <span class="user-chip" id="whoami"></span>
                <button class="icon-button" id="logout-button" title="Sign out">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </header>

        <main>
            <div class="dashboard-toolbar">
                <label class="refresh-select">
                    Refresh
                    <select id="refresh-interval-select">
                        <option value="500">0.5s</option>
                        <option value="1000">1s</option>
                        <option value="3000">3s</option>
                        <option value="5000">5s</option>
                    </select>
                </label>
            </div>
            <div id="components"></div>
        </main>
    </div>
</div>

<script src="/notifications.js"></script>
<script>
(function () {
    const DEFAULT_REFRESH_INTERVAL_MS = 1000;
    const VALID_REFRESH_INTERVALS_MS = [500, 1000, 3000, 5000];
    const REFRESH_COOKIE_NAME = "dashboardRefreshMs";
    let refreshTimer = null;

    function getCookie(name) {
        const match = document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)"));
        return match ? decodeURIComponent(match[1]) : null;
    }

    function setCookie(name, value) {
        // 1 year, readable by this page's own JS only (no HttpOnly) - just a
        // display preference, not something the server needs to see.
        document.cookie = name + "=" + encodeURIComponent(value) + "; path=/; max-age=31536000; samesite=lax";
    }

    const storedRefreshMs = parseInt(getCookie(REFRESH_COOKIE_NAME), 10);
    let refreshIntervalMs = VALID_REFRESH_INTERVALS_MS.indexOf(storedRefreshMs) >= 0 ? storedRefreshMs : DEFAULT_REFRESH_INTERVAL_MS;

    // Same viewBox/stroke conventions, and the same Blinds glyph, as
    // DeviceIQ's own component icon set.
    const BLINDS_ICON = '<rect x="3" y="3" width="18" height="18" rx="1"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/>';

    function svg(inner) {
        return '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
    }

    function componentIcon() {
        const wrap = document.createElement("div");
        wrap.className = "comp-icon";
        wrap.innerHTML = svg(BLINDS_ICON);
        return wrap;
    }

    function controlButton(label, onClick) {
        const button = document.createElement("button");
        button.className = "secondary";
        button.textContent = label;
        button.addEventListener("click", onClick);
        return button;
    }

    function pill(text, kind) {
        const el = document.createElement("span");
        el.className = "pill " + kind;
        el.textContent = text;
        return el;
    }

    // Mirrors DeviceIQ's own blindsBody(): a state+position pill, a
    // progress bar, and Open/Stop/Close controls. Unlike DeviceIQ's
    // component cards, these controls aren't admin-only - operating the
    // blinds is this device's everyday function, not device configuration.
    function blindsBody(item, side) {
        const wrap = document.createElement("div");
        wrap.className = "comp-stack";

        const row = document.createElement("div");
        row.className = "comp-row";
        const label = item.state.charAt(0).toUpperCase() + item.state.slice(1);
        row.appendChild(pill(label + " · " + item.position + "%", item.state === "stopped" ? "off" : "warn"));
        wrap.appendChild(row);

        const bar = document.createElement("div");
        bar.className = "bar";
        const fill = document.createElement("div");
        fill.className = "bar-fill";
        fill.style.width = item.position + "%";
        bar.appendChild(fill);
        wrap.appendChild(bar);

        const controls = document.createElement("div");
        controls.className = "comp-controls";
        controls.appendChild(controlButton("Open", function () { setState(side, "open"); }));
        controls.appendChild(controlButton("Stop", function () { setState(side, "stop"); }));
        controls.appendChild(controlButton("Close", function () { setState(side, "close"); }));
        wrap.appendChild(controls);

        return wrap;
    }

    function renderCard(item, side) {
        const card = document.createElement("div");
        card.className = "comp-card";

        const header = document.createElement("div");
        header.className = "comp-header";
        header.appendChild(componentIcon());

        const title = document.createElement("div");
        title.className = "comp-title";
        const name = document.createElement("div");
        name.className = "comp-name";
        name.textContent = item.name;
        const cls = document.createElement("div");
        cls.className = "comp-class";
        cls.textContent = "Blinds · " + (side === "left" ? "Left" : "Right");
        title.appendChild(name);
        title.appendChild(cls);
        header.appendChild(title);
        card.appendChild(header);

        const body = document.createElement("div");
        body.className = "comp-body";
        body.appendChild(blindsBody(item, side));
        card.appendChild(body);

        return card;
    }

    function render(data) {
        const container = document.getElementById("components");
        container.innerHTML = "";

        const grid = document.createElement("div");
        grid.className = "comp-grid";
        grid.appendChild(renderCard({ name: data.leftname, state: data.leftstate, position: data.leftposition }, "left"));
        grid.appendChild(renderCard({ name: data.rightname, state: data.rightstate, position: data.rightposition }, "right"));
        container.appendChild(grid);
    }

    function setState(side, state) {
        const param = side === "left" ? "leftstate" : "rightstate";
        fetch("/api/blinds?" + param + "=" + state).finally(refresh);
    }

    function refresh() {
        fetch("/api/blinds").then(function (response) { return response.json(); }).then(render).catch(function () {});
    }

    function startRefreshTimer() {
        if (refreshTimer) clearInterval(refreshTimer);
        refreshTimer = setInterval(refresh, refreshIntervalMs);
    }

    fetch("/api/session").then(function (response) { return response.json(); }).then(function (data) {
        if (!data.authenticated) {
            window.location.replace("/");
            return;
        }
        document.getElementById("topbar-hostname").textContent = data.hostname;
        document.getElementById("whoami").textContent = data.username + (data.admin ? " · admin" : "");
        document.title = data.productFamily + " [" + data.hostname + "] - Dashboard";
        document.getElementById("sidebar-product").textContent = data.productFamily + " " + data.productName;
        document.getElementById("sidebar-version").textContent = "v" + data.softwareVersion;
        if (!data.admin) {
            document.getElementById("config-link").remove();
            document.getElementById("users-link").remove();
        }

        refresh();
        startRefreshTimer();
    }).catch(function () { window.location.replace("/"); });

    const refreshSelect = document.getElementById("refresh-interval-select");
    refreshSelect.value = String(refreshIntervalMs);
    refreshSelect.addEventListener("change", function () {
        refreshIntervalMs = parseInt(refreshSelect.value, 10);
        setCookie(REFRESH_COOKIE_NAME, String(refreshIntervalMs));
        startRefreshTimer();
    });

    document.getElementById("logout-button").addEventListener("click", function () {
        if (refreshTimer) clearInterval(refreshTimer);
        fetch("/api/logout", { method: "POST" }).finally(function () { window.location.replace("/"); });
    });
})();
</script>
</body>
</html>
